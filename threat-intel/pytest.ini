[pytest]
python_files = test_*.py
# pytest-django lives in the shared venv; it has nothing to do here.
addopts = -q -p no:django
# The pinned starlette uses an anyio alias newer anyio versions deprecate. Not ours to fix.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
